[project]
name = "abraxas-graphql"
version = "1.0.0"
description = "Abraxas GraphQL API — Strawberry + ArangoDB"
requires-python = ">=3.11"
dependencies = [
    "strawberry-graphql[fastapi]>=0.220.0",
    "python-arango>=8.0.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.136.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"**/schema.py" = ["I001"]
