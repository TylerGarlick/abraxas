services:
  abraxas-mcp:
    build:
      context: .
      dockerfile: infra/mcp/Dockerfile
    container_name: abraxas-mcp
    environment:
      - ARANGO_URL=http://arangodb:8529
      - ARANGO_DB=abraxas_prod
      - ARANGO_USER=root
      - ARANGO_ROOT_PASSWORD=
      - ABRAXAS_ROOT=/workspace
      - PYTHONPATH=/workspace
    volumes:
      - .:/workspace
    ports:
      - "9900:9900"
      - "9901:9901"
    restart: always
    depends_on:
      - arangodb

  abraxas-graphql:
    build:
      context: .
      dockerfile: infra/api/graphql/Dockerfile
    container_name: abraxas-graphql
    environment:
      - ARANGO_URL=http://arangodb:8529
      - ARANGO_DB=abraxas_prod
      - ARANGO_USER=root
      - ARANGO_ROOT_PASSWORD=
      - PYTHONPATH=/workspace
      - SOVEREIGN_CHANNELS=${SOVEREIGN_CHANNELS:-}
    volumes:
      - .:/workspace
    ports:
      - "4000:4000"
    restart: always
    depends_on:
      - arangodb

  arangodb:
    image: arangodb/arangodb:3.12
    container_name: arangodb
    environment:
      - ARANGO_ROOT_PASSWORD=
      - ARANGO_SAMPLED_DATA=false
    ports:
      - "8529:8529"
    volumes:
      - ./arangodb-data:/var/lib/arangodb
    command: arangod --server.endpoint tcp://0.0.0.0:8529 --server.authentication false --database.directory /var/lib/arangodb
    restart: always
