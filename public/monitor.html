
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGENT MONITOR // DASHBOARD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AGENT MONITOR</h1>
      <div class="subtitle">// SYSTEM STATUS DASHBOARD //</div>
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="docs.html">Docs</a>
      <a href="monitor.html">Monitor</a>
    </nav>
    
    <div class="status-bar">
      <div class="status-item">
        <span class="status-led led-green blink"></span>
        <span>SYSTEM ONLINE</span>
      </div>
      <div class="status-item">
        <span class="label">LAST UPDATE:</span>
        <span id="last-update">--:--:--</span>
      </div>
      <div class="status-item">
        <span class="label">TOTAL AGENTS:</span>
        <span id="total-agents">0</span>
      </div>
    </div>
    
    <div id="agent-grid" class="agent-grid">
      <div class="loading">
        <span class="spinner">⟳</span> INITIALIZING...
      </div>
    </div>
    
    <footer>
      <div>AGENT MONITOR DASHBOARD v1.0 // PHASE 1</div>
      <div>AUTO-REFRESH: 15s INTERVAL</div>
    </footer>
  </div>
  
  <script>
    const REFRESH_INTERVAL = 15000; // 15 seconds
    let lastData = null;
    
    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-US', { 
        hour12: false, 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });
    }
    
    function getStatusColor(status) {
      const s = (status || '').toLowerCase();
      if (s.includes('fail') || s.includes('error') || s.includes('dead')) return 'red';
      if (s.includes('idle') || s.includes('wait') || s.includes('sleep')) return 'amber';
      return 'green';
    }
    
    function createAgentCard(agent) {
      const statusColor = getStatusColor(agent.status);
      const ledClass = `led-${statusColor}`;
      const statusClass = `status-${statusColor}`;
      const cardType = agent.type === 'session' ? 'type-session' : '';
      const typeLabel = agent.type === 'session' ? 'SESSION' : 'SUBAGENT';
      
      return `
        <div class="agent-card ${cardType}">
          <div class="card-header">
            <span class="agent-id">${agent.name || agent.id}</span>
            <span class="agent-type type-${agent.type}">${typeLabel}</span>
          </div>
          <div class="card-body">
            <div class="card-row">
              <span class="label">ID:</span>
              <span class="value">${agent.id}</span>
            </div>
            <div class="card-row">
              <span class="label">TASK:</span>
              <span class="value">${agent.task || 'N/A'}</span>
            </div>
            <div class="card-row">
              <span class="label">RUNTIME:</span>
              <span class="value">${agent.runtime || 'N/A'}</span>
            </div>
          </div>
          <div class="agent-status">
            <span class="status-led ${ledClass}"></span>
            <span class="status-text ${statusClass}">${agent.status || 'UNKNOWN'}</span>
          </div>
        </div>
      `;
    }
    
    async function fetchAgentData() {
      try {
        const response = await fetch('/api/status');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        lastData = data;
        
        document.getElementById('last-update').textContent = formatTime(data.timestamp);
        document.getElementById('total-agents').textContent = data.totalAgents || 0;
        
        const grid = document.getElementById('agent-grid');
        
        if (!data.agents || data.agents.length === 0) {
          grid.innerHTML = `
            <div class="loading" style="color: #ffb000;">
              ⚠ NO ACTIVE AGENTS DETECTED
            </div>
          `;
          return;
        }
        
        grid.innerHTML = data.agents.map(agent => createAgentCard(agent)).join('');
        
      } catch (error) {
        console.error('Failed to fetch agent data:', error);
        const grid = document.getElementById('agent-grid');
        grid.innerHTML = `
          <div class="error">
            ⚠ CONNECTION ERROR<br>
            <small>${error.message}</small>
          </div>
        `;
      }
    }
    
    fetchAgentData();
    setInterval(fetchAgentData, REFRESH_INTERVAL);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        fetchAgentData();
      }
    });
  </script>
</body>
</html>
