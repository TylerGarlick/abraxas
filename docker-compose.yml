services:
  # --- ABRAXAS UNIFIED MCP OS (The Brain) ---
  abraxas-mcp:
    build:
      context: .
      dockerfile: infra/mcp/Dockerfile
    container_name: abraxas-mcp
    environment:
      - ARANGO_URL=http://arangodb:8529
      - ARANGO_DB=${ARANGO_DB}
      - ARANGO_USER=${ARANGO_USER}
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD}
      - ABRAXAS_ROOT=/workspace
      - PYTHONPATH=/workspace
    volumes:
      - .:/workspace
    ports:
      - "9900:3000"
    restart: always
    depends_on:
      arangodb:
        condition: service_started

  # --- DATABASE LAYER ---
  arangodb:
    image: arangodb/arangodb:latest
    container_name: arangodb
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD}
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb
    restart: always

volumes:
  arangodb_data:
