<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGENT MONITOR // DASHBOARD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #0a0a0a;
      color: #00ff41;
      font-family: 'VT323', monospace;
      font-size: 16px;
      line-height: 1.4;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    /* CRT Scanline Effect */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 9999;
    }
    
    /* CRT Flicker Animation */
    @keyframes flicker {
      0% { opacity: 0.97; }
      5% { opacity: 0.95; }
      10% { opacity: 0.9; }
      15% { opacity: 0.95; }
      20% { opacity: 0.99; }
      25% { opacity: 0.95; }
      30% { opacity: 0.9; }
      35% { opacity: 0.96; }
      40% { opacity: 0.98; }
      45% { opacity: 0.95; }
      50% { opacity: 0.99; }
      55% { opacity: 0.93; }
      60% { opacity: 0.96; }
      65% { opacity: 0.99; }
      70% { opacity: 0.94; }
      75% { opacity: 0.95; }
      80% { opacity: 0.98; }
      85% { opacity: 0.91; }
      90% { opacity: 0.96; }
      95% { opacity: 0.99; }
      100% { opacity: 0.95; }
    }
    
    .container {
      animation: flicker 0.15s infinite;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    /* Header */
    header {
      border-bottom: 2px solid #00ff41;
      padding: 20px 0;
      margin-bottom: 30px;
      text-align: center;
      text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
    }
    
    h1 {
      font-size: 3rem;
      letter-spacing: 8px;
      margin-bottom: 10px;
    }
    
    .subtitle {
      font-size: 1.2rem;
      color: #ffb000;
      text-shadow: 0 0 8px #ffb000;
    }
    
    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border: 1px solid #00ff41;
      margin-bottom: 30px;
      background: rgba(0, 255, 65, 0.05);
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .status-led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px currentColor;
    }
    
    .led-green {
      background-color: #00ff41;
      color: #00ff41;
    }
    
    .led-amber {
      background-color: #ffb000;
      color: #ffb000;
    }
    
    .led-red {
      background-color: #ff003c;
      color: #ff003c;
    }
    
    .blink {
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }
    
    /* Agent Grid */
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .agent-card {
      border: 1px solid #00ff41;
      padding: 20px;
      background: rgba(0, 255, 65, 0.03);
      position: relative;
      transition: all 0.3s ease;
    }
    
    .agent-card:hover {
      background: rgba(0, 255, 65, 0.08);
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
    }
    
    .agent-card.type-session {
      border-color: #ffb000;
    }
    
    .agent-card.type-session:hover {
      box-shadow: 0 0 15px rgba(255, 176, 0, 0.3);
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0, 255, 65, 0.3);
    }
    
    .agent-id {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00ff41;
    }
    
    .agent-type {
      font-size: 0.8rem;
      padding: 2px 8px;
      border: 1px solid currentColor;
      text-transform: uppercase;
    }
    
    .type-subagent {
      color: #00ff41;
      border-color: #00ff41;
    }
    
    .type-session {
      color: #ffb000;
      border-color: #ffb000;
    }
    
    .card-body {
      margin-bottom: 15px;
    }
    
    .card-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .label {
      color: #888;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    
    .value {
      color: #00ff41;
      text-align: right;
      max-width: 60%;
      word-break: break-word;
    }
    
    .agent-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 255, 65, 0.3);
    }
    
    .status-text {
      font-weight: bold;
      text-transform: uppercase;
    }
    
    .status-active {
      color: #00ff41;
    }
    
    .status-idle {
      color: #ffb000;
    }
    
    .status-failed {
      color: #ff003c;
    }
    
    /* Loading State */
    .loading {
      text-align: center;
      padding: 50px;
      font-size: 1.5rem;
      color: #ffb000;
    }
    
    .loading .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* Error State */
    .error {
      text-align: center;
      padding: 50px;
      color: #ff003c;
      border: 1px solid #ff003c;
      margin: 20px;
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #00ff41;
      margin-top: 30px;
      font-size: 0.9rem;
      color: #888;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .agent-grid {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 2rem;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AGENT MONITOR</h1>
      <div class="subtitle">// SYSTEM STATUS DASHBOARD //</div>
    </header>
    
    <div class="status-bar">
      <div class="status-item">
        <span class="status-led led-green blink"></span>
        <span>SYSTEM ONLINE</span>
      </div>
      <div class="status-item">
        <span class="label">LAST UPDATE:</span>
        <span id="last-update">--:--:--</span>
      </div>
      <div class="status-item">
        <span class="label">TOTAL AGENTS:</span>
        <span id="total-agents">0</span>
      </div>
    </div>
    
    <div id="agent-grid" class="agent-grid">
      <div class="loading">
        <span class="spinner">⟳</span> INITIALIZING...
      </div>
    </div>
    
    <footer>
      <div>AGENT MONITOR DASHBOARD v1.0 // PHASE 1</div>
      <div>AUTO-REFRESH: 15s INTERVAL</div>
    </footer>
  </div>
  
  <script>
    const REFRESH_INTERVAL = 15000; // 15 seconds
    let lastData = null;
    
    // Format timestamp
    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-US', { 
        hour12: false, 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });
    }
    
    // Get status LED color
    function getStatusColor(status) {
      const s = (status || '').toLowerCase();
      if (s.includes('fail') || s.includes('error') || s.includes('dead')) return 'red';
      if (s.includes('idle') || s.includes('wait') || s.includes('sleep')) return 'amber';
      return 'green';
    }
    
    // Create agent card HTML
    function createAgentCard(agent) {
      const statusColor = getStatusColor(agent.status);
      const ledClass = `led-${statusColor}`;
      const statusClass = `status-${statusColor}`;
      const cardType = agent.type === 'session' ? 'type-session' : '';
      const typeLabel = agent.type === 'session' ? 'SESSION' : 'SUBAGENT';
      
      return `
        <div class="agent-card ${cardType}">
          <div class="card-header">
            <span class="agent-id">${agent.name || agent.id}</span>
            <span class="agent-type type-${agent.type}">${typeLabel}</span>
          </div>
          <div class="card-body">
            <div class="card-row">
              <span class="label">ID:</span>
              <span class="value">${agent.id}</span>
            </div>
            <div class="card-row">
              <span class="label">TASK:</span>
              <span class="value">${agent.task || 'N/A'}</span>
            </div>
            <div class="card-row">
              <span class="label">RUNTIME:</span>
              <span class="value">${agent.runtime || 'N/A'}</span>
            </div>
          </div>
          <div class="agent-status">
            <span class="status-led ${ledClass}"></span>
            <span class="status-text ${statusClass}">${agent.status || 'UNKNOWN'}</span>
          </div>
        </div>
      `;
    }
    
    // Fetch and display agent data
    async function fetchAgentData() {
      try {
        const response = await fetch('/api/status');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        lastData = data;
        
        // Update status bar
        document.getElementById('last-update').textContent = formatTime(data.timestamp);
        document.getElementById('total-agents').textContent = data.totalAgents || 0;
        
        // Render agent grid
        const grid = document.getElementById('agent-grid');
        
        if (!data.agents || data.agents.length === 0) {
          grid.innerHTML = `
            <div class="loading" style="color: #ffb000;">
              ⚠ NO ACTIVE AGENTS DETECTED
            </div>
          `;
          return;
        }
        
        grid.innerHTML = data.agents.map(agent => createAgentCard(agent)).join('');
        
      } catch (error) {
        console.error('Failed to fetch agent data:', error);
        const grid = document.getElementById('agent-grid');
        grid.innerHTML = `
          <div class="error">
            ⚠ CONNECTION ERROR<br>
            <small>${error.message}</small>
          </div>
        `;
      }
    }
    
    // Initial load
    fetchAgentData();
    
    // Auto-refresh
    setInterval(fetchAgentData, REFRESH_INTERVAL);
    
    // Manual refresh on visibility change
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        fetchAgentData();
      }
    });
  </script>
</body>
</html>
