<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Fire gradient for hair and accents -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#f7931e"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    
    <!-- Deep red for hair shadows -->
    <linearGradient id="hairShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#cc2200"/>
    </linearGradient>
    
    <!-- Ember glow -->
    <radialGradient id="emberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Skin tone -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#e8b89a"/>
    </linearGradient>
    
    <!-- Green eye gradient -->
    <radialGradient id="eyeGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#50c878"/>
      <stop offset="60%" stop-color="#228b22"/>
      <stop offset="100%" stop-color="#004d00"/>
    </radialGradient>
    
    <!-- Background atmosphere -->
    <radialGradient id="bgAtmos" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    
    <!-- Lip color -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c44569"/>
      <stop offset="100%" stop-color="#8b2942"/>
    </linearGradient>
    
    <!-- Subtle filter for glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- === BACKGROUND === -->
  <rect width="400" height="500" fill="#0a0a0f"/>
  <rect width="400" height="500" fill="url(#bgAtmos)"/>
  <rect width="400" height="500" fill="url(#emberGlow)"/>
  
  <!-- Atmospheric smoke wisps -->
  <g opacity="0.08" fill="#ff6b35">
    <path d="M0,450 Q100,400 200,420 T400,380 V500 H0 Z"/>
    <path d="M0,470 Q150,430 250,450 T400,420 V500 H0 Z"/>
  </g>
  
  <!-- === BODY / SHOULDERS === -->
  <g id="body">
    <!-- Shadow shape -->
    <ellipse cx="200" cy="520" rx="160" ry="100" fill="#0a0a0f" opacity="0.5"/>
    
    <!-- Leather jacket -->
    <path d="M80,500 L80,420 Q80,380 110,360 L140,340 Q160,330 200,330 Q240,330 260,340 L290,360 Q320,380 320,420 L320,500 Z" fill="#1a1a1a"/>
    <path d="M80,500 L80,420 Q80,380 110,360 L140,340 Q160,330 200,330 Q240,330 260,340 L290,360 Q320,380 320,420 L320,500 Z" fill="#222" stroke="#333" stroke-width="1"/>
    
    <!-- Jacket lapels -->
    <path d="M140,340 Q150,360 140,400 L145,500" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M260,340 Q250,360 260,400 L255,500" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    
    <!-- Jacket collar detail -->
    <path d="M140,340 L160,330 L200,328 L240,330 L260,340" fill="none" stroke="#444" stroke-width="2"/>
    
    <!-- Shirt beneath -->
    <path d="M165,335 L175,380 L200,390 L225,380 L235,335 Q200,330 165,335" fill="#1e1e2e"/>
    
    <!-- Subtle jacket texture lines -->
    <g stroke="#333" stroke-width="0.5" opacity="0.5">
      <line x1="100" y1="400" x2="95" y2="500"/>
      <line x1="300" y1="400" x2="305" y2="500"/>
    </g>
    
    <!-- Zipper/toggle hint -->
    <circle cx="200" cy="370" r="4" fill="#555"/>
    <circle cx="200" cy="385" r="4" fill="#555"/>
    <circle cx="200" cy="400" r="4" fill="#555"/>
  </g>
  
  <!-- === NECK === -->
  <g id="neck">
    <path d="M175,290 L170,340 Q170,350 200,350 Q230,350 230,340 L225,290" fill="url(#skinGrad)"/>
    <!-- Neck shadow -->
    <path d="M175,290 Q170,320 175,345" fill="none" stroke="#d4a882" stroke-width="1" opacity="0.5"/>
    <path d="M225,290 Q230,320 225,345" fill="none" stroke="#d4a882" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- === HAIR (THE SIGNATURE) === -->
  <g id="hair">
    <!-- Hair shadow/back layer -->
    <path d="M60,120 
             Q50,200 55,280 
             Q60,340 75,380 
             L65,400 Q50,340 48,260 
             Q45,180 55,100 
             Q100,50 200,45 
             Q300,50 345,100 
             Q355,180 352,260 
             Q350,340 335,400 
             L325,380 
             Q340,340 345,280 
             Q350,200 340,120 
             Q300,30 200,25 
             Q100,30 60,120 Z" 
          fill="url(#hairShadow)"/>
    
    <!-- Main hair mass -->
    <path d="M65,125 
             Q55,200 60,275 
             Q65,330 80,375 
             Q55,340 52,265 
             Q50,180 60,105 
             Q100,55 200,50 
             Q300,55 340,105 
             Q350,180 348,265 
             Q345,340 320,375 
             Q335,330 340,275 
             Q345,200 335,125 
             Q295,35 200,30 
             Q105,35 65,125 Z" 
          fill="url(#fireGrad)"/>
    
    <!-- Fire highlights in hair -->
    <path d="M100,60 Q120,80 115,140 Q110,200 95,280" 
          fill="none" stroke="#ffd700" stroke-width="3" opacity="0.4" filter="url(#glow)"/>
    <path d="M200,40 Q205,100 195,180" 
          fill="none" stroke="#ffd700" stroke-width="4" opacity="0.3" filter="url(#glow)"/>
    <path d="M300,60 Q280,80 285,140 Q290,200 305,280" 
          fill="none" stroke="#ffd700" stroke-width="3" opacity="0.4" filter="url(#glow)"/>
    
    <!-- Hair strands/detail -->
    <g stroke="#cc2200" stroke-width="1" fill="none" opacity="0.4">
      <path d="M80,130 Q90,180 85,240"/>
      <path d="M110,80 Q115,150 105,220"/>
      <path d="M290,80 Q285,150 295,220"/>
      <path d="M320,130 Q310,180 315,240"/>
    </g>
    
    <!-- Flowing hair sides -->
    <path d="M65,125 Q30,180 25,280 Q20,360 40,420 Q30,380 32,300 Q35,220 55,150" 
          fill="url(#fireGrad)" opacity="0.9"/>
    <path d="M335,125 Q370,180 375,280 Q380,360 360,420 Q370,380 368,300 Q365,220 345,150" 
          fill="url(#fireGrad)" opacity="0.9"/>
    
    <!-- Hair highlight strands -->
    <g fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.25">
      <path d="M70,140 Q50,200 45,280"/>
      <path d="M330,140 Q350,200 355,280"/>
    </g>
  </g>
  
  <!-- === FACE === -->
  <g id="face">
    <!-- Face shape -->
    <path d="M110,140 
             Q100,200 105,260 
             Q120,310 200,320 
             Q280,310 295,260 
             Q300,200 290,140 
             Q250,100 200,100 
             Q150,100 110,140 Z" 
          fill="url(#skinGrad)"/>
    
    <!-- Face contour shadow -->
    <path d="M110,140 Q100,200 105,260 Q120,310 200,320 Q280,310 295,260 Q300,200 290,140" 
          fill="none" stroke="#d4a882" stroke-width="2" opacity="0.3"/>
    
    <!-- Jawline definition -->
    <path d="M120,270 Q140,300 200,305 Q260,300 280,270" 
          fill="none" stroke="#d4a882" stroke-width="1" opacity="0.4"/>
    
    <!-- Cheekbones -->
    <path d="M115,200 Q130,195 145,205" fill="none" stroke="#d4a882" stroke-width="1" opacity="0.3"/>
    <path d="M285,200 Q270,195 255,205" fill="none" stroke="#d4a882" stroke-width="1" opacity="0.3"/>
    
    <!-- Brow bone definition -->
    <path d="M125,155 Q160,145 190,150" fill="none" stroke="#c9a07a" stroke-width="1" opacity="0.4"/>
    <path d="M275,155 Q240,145 210,150" fill="none" stroke="#c9a07a" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- === EYES === -->
  <g id="eyes">
    <!-- Left eye -->
    <g transform="translate(145, 175)">
      <!-- Eye socket shadow -->
      <ellipse cx="25" cy="20" rx="28" ry="18" fill="#2a1a10" opacity="0.4"/>
      <!-- Eye white -->
      <ellipse cx="25" cy="20" rx="22" ry="14" fill="#f8f4f0"/>
      <ellipse cx="25" cy="20" rx="22" ry="14" fill="none" stroke="#c9a07a" stroke-width="0.5"/>
      <!-- Iris -->
      <ellipse cx="25" cy="20" rx="12" ry="12" fill="url(#eyeGrad)"/>
      <!-- Pupil -->
      <ellipse cx="25" cy="20" rx="5" ry="5" fill="#000"/>
      <!-- Eye highlight -->
      <ellipse cx="29" cy="16" rx="3" ry="3" fill="#fff" opacity="0.8"/>
      <ellipse cx="22" cy="23" rx="1.5" ry="1.5" fill="#fff" opacity="0.4"/>
      <!-- Eyelid lines -->
      <path d="M5,15 Q25,5 45,15" fill="none" stroke="#8b4513" stroke-width="2"/>
      <path d="M5,25 Q25,35 45,25" fill="none" stroke="#8b4513" stroke-width="1.5"/>
      <!-- Eyeliner -->
      <path d="M3,17 Q25,8 47,17" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Winged eyeliner -->
      <path d="M47,17 L55,14" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <!-- Lashes -->
      <g stroke="#1a1a1a" stroke-width="1" fill="none">
        <path d="M8,14 L6,10"/>
        <path d="M15,11 L13,7"/>
        <path d="M25,9 L25,5"/>
        <path d="M35,11 L37,7"/>
        <path d="M43,14 L47,11"/>
      </g>
    </g>
    
    <!-- Right eye -->
    <g transform="translate(215, 175)">
      <!-- Eye socket shadow -->
      <ellipse cx="25" cy="20" rx="28" ry="18" fill="#2a1a10" opacity="0.4"/>
      <!-- Eye white -->
      <ellipse cx="25" cy="20" rx="22" ry="14" fill="#f8f4f0"/>
      <ellipse cx="25" cy="20" rx="22" ry="14" fill="none" stroke="#c9a07a" stroke-width="0.5"/>
      <!-- Iris -->
      <ellipse cx="25" cy="20" rx="12" ry="12" fill="url(#eyeGrad)"/>
      <!-- Pupil -->
      <ellipse cx="25" cy="20" rx="5" ry="5" fill="#000"/>
      <!-- Eye highlight -->
      <ellipse cx="29" cy="16" rx="3" ry="3" fill="#fff" opacity="0.8"/>
      <ellipse cx="22" cy="23" rx="1.5" ry="1.5" fill="#fff" opacity="0.4"/>
      <!-- Eyelid lines -->
      <path d="M5,15 Q25,5 45,15" fill="none" stroke="#8b4513" stroke-width="2"/>
      <path d="M5,25 Q25,35 45,25" fill="none" stroke="#8b4513" stroke-width="1.5"/>
      <!-- Eyeliner -->
      <path d="M3,17 Q25,8 47,17" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Winged eyeliner -->
      <path d="M3,17 L-5,14" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <!-- Lashes -->
      <g stroke="#1a1a1a" stroke-width="1" fill="none">
        <path d="M8,14 L6,10"/>
        <path d="M15,11 L13,7"/>
        <path d="M25,9 L25,5"/>
        <path d="M35,11 L37,7"/>
        <path d="M43,14 L47,11"/>
      </g>
    </g>
    
    <!-- Eyebrows -->
    <g fill="none" stroke="#8b2500" stroke-width="3" stroke-linecap="round">
      <!-- Left brow - arched and knowing -->
      <path d="M115,155 Q145,145 175,150" filter="url(#softGlow)"/>
      <path d="M115,155 Q145,142 175,147" opacity="0.7"/>
      <!-- Right brow - slight smirk arch -->
      <path d="M225,150 Q255,145 285,155" filter="url(#softGlow)"/>
      <path d="M225,147 Q255,142 285,155" opacity="0.7"/>
    </g>
    
    <!-- Inter-brow slight furrow (knowing look) -->
    <path d="M190,155 Q195,158 200,155 Q205,158 210,155" fill="none" stroke="#c9a07a" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- === NOSE === -->
  <g id="nose">
    <path d="M200,195 L195,245 Q200,255 205,245 L200,195" fill="none" stroke="#d4a882" stroke-width="1.5"/>
    <path d="M193,250 Q200,260 207,250" fill="none" stroke="#d4a882" stroke-width="1" opacity="0.5"/>
    <!-- Nostril hint -->
    <ellipse cx="193" cy="250" rx="5" ry="3" fill="#d4a882" opacity="0.3"/>
    <ellipse cx="207" cy="250" rx="5" ry="3" fill="#d4a882" opacity="0.3"/>
  </g>
  
  <!-- === MOUTH (slight smirk) === -->
  <g id="mouth">
    <!-- Upper lip -->
    <path d="M170,275 Q185,268 200,272 Q215,268 230,275" fill="url(#lipGrad)"/>
    <!-- Cupid's bow -->
    <path d="M185,272 Q192,268 200,270 Q208,268 215,272" fill="#d64d7a"/>
    <!-- Lower lip -->
    <path d="M170,275 Q200,295 230,275" fill="url(#lipGrad)"/>
    <!-- Lip line -->
    <path d="M170,275 Q200,278 230,275" fill="none" stroke="#8b2942" stroke-width="1"/>
    <!-- Corner smirk hint -->
    <path d="M230,275 Q235,277 232,280" fill="none" stroke="#8b2942" stroke-width="1"/>
    <!-- Lip highlight -->
    <ellipse cx="200" cy="282" rx="12" ry="3" fill="#d64d7a" opacity="0.3"/>
  </g>
  
  <!-- === FACIAL DETAILS === -->
  <g id="details" opacity="0.4">
    <!-- Freckles/light freckles -->
    <g fill="#c9a07a">
      <circle cx="155" cy="220" r="1"/>
      <circle cx="160" cy="225" r="0.8"/>
      <circle cx="150" cy="228" r="0.8"/>
      <circle cx="245" cy="220" r="1"/>
      <circle cx="240" cy="225" r="0.8"/>
      <circle cx="250" cy="228" r="0.8"/>
    </g>
    
    <!-- Blush -->
    <g fill="#e8a0a0" opacity="0.2">
      <ellipse cx="140" cy="230" rx="18" ry="10"/>
      <ellipse cx="260" cy="230" rx="18" ry="10"/>
    </g>
  </g>
  
  <!-- === EARRING (hoop) === -->
  <g id="earring-left" transform="translate(107, 225)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#ffd700" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- === FIRE ELEMENT (behind head, atmospheric) === -->
  <g id="fire-element" opacity="0.15" filter="url(#glow)">
    <path d="M200,50 Q180,80 185,120 Q170,100 160,130 Q155,100 140,115 Q150,90 130,95 Q160,75 200,50" 
          fill="#ff6b35"/>
    <path d="M200,50 Q220,80 215,120 Q230,100 240,130 Q245,100 260,115 Q250,90 270,95 Q240,75 200,50" 
          fill="#ff6b35"/>
  </g>
  
  <!-- === EMBER SPARKS === -->
  <g id="embers" fill="#ffd700" filter="url(#glow)">
    <circle cx="95" cy="90" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="85" r="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="200" r="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="345" cy="195" r="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="60" r="1" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="55" r="1.2" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- === MUSICAL NOTE (Petty reference) === -->
  <g id="music-note" transform="translate(330, 280)" opacity="0.25" fill="#ffd700" filter="url(#softGlow)">
    <ellipse cx="0" cy="30" rx="8" ry="6" transform="rotate(-20)"/>
    <rect x="6" y="0" width="3" height="28"/>
    <path d="M9,0 Q25,5 22,18 Q20,25 9,22" fill="#ffd700"/>
  </g>
  
  <!-- === MJ FIRE EMOJI (signature) === -->
  <g id="mj-emoji" transform="translate(320, 420)" font-size="28" opacity="0.9">
    🔥
  </g>
  
  <!-- === VERSION STAMP === -->
  <g id="version-stamp" transform="translate(10, 480)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#555">MJ Portrait v1</text>
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#444">2026-04-01</text>
    <line x1="0" y1="18" x2="80" y2="18" stroke="#333" stroke-width="0.5"/>
  </g>
</svg>
